services:
  game:
    build: .
    ports:
      # Reachable from this host only: the proxy in front of the game supplies the player identity.
      - "127.0.0.1:8080:8080"
    environment:
      WORLD_SEED: ${WORLD_SEED:-}
    volumes:
      - world:/data
    restart: unless-stopped

volumes:
  world:
